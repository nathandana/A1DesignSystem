<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A1 Design System Examples</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
        background: #f7f7f7;
      }

      body {
        margin: 0;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1;
      }

      p {
        max-width: 640px;
        margin: 16px 0 0;
        color: #525252;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
      }

      a {
        display: block;
        min-height: 72px;
        padding: 16px;
        border: 1px solid #d4d4d4;
        border-radius: 8px;
        color: inherit;
        background: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        border-color: #171717;
        outline: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color: #fafafa;
          background: #171717;
        }

        p {
          color: #d4d4d4;
        }

        a {
          border-color: #525252;
          background: #262626;
        }

        a:hover,
        a:focus-visible {
          border-color: #fafafa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A1 Design System</h1>
      <p>Choose an example or tool to open from the local Vite server.</p>
      <ul>
        <li><a href="/examples/a1-pure/">A1 Pure</a></li>
        <li><a href="/examples/cat-lympics/">Catlympics</a></li>
        <li><a href="/examples/cat-stack-cafe/">Cat Stack Cafe</a></li>
        <li><a href="/examples/hello-world/">Hello World</a></li>
        <li><a href="/examples/nathan-dana/">Nathan Dana</a></li>
        <li><a href="/examples/portfolio/">Portfolio</a></li>
        <li><a href="/examples/priority-guide/">Priority Guide</a></li>
        <li><a href="/examples/theme-editor/">Theme Editor</a></li>
      </ul>
    </main>
  </body>
</html>
