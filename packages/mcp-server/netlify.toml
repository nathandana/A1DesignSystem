[build]
  command = "npm run netlify:build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# No frontend framework here — just a static public/ landing page plus
# functions. Without this, `netlify dev`'s framework auto-detection picks up
# an unrelated tool elsewhere in the monorepo (e.g. tries to run `hugo`).
[dev]
  framework = "#static"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Friendlier public path than /.netlify/functions/mcp.
[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
