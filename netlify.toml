[build]
  command = "npm run build:a1-web"
  publish = "apps/a1-web/dist"
  functions = "apps/a1-web/netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Supabase (accounts + cloud sync). Vite inlines VITE_* at build time, so these
  # must be present in the build env. The ANON/publishable key is client-safe —
  # it ships in the public JS bundle and is protected by row-level security; the
  # `sb_secret_` service key must NEVER be placed here. (Override via Netlify's
  # Environment Variables UI to rotate without a commit.)
  VITE_SUPABASE_URL = "https://pszmkbfvyjkifbyututo.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_a_CSB8TLB8AziGTAVN4zoQ_Uum-Wr4I"

[functions]
  node_bundler = "esbuild"

# SPA catch-all. Netlify serves functions at /.netlify/functions/* and static
# files before applying this rewrite, so it does not shadow them — no explicit
# function pass-through rule is needed (and one without a `to` is invalid).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
