[build]
  command = "npm run build:a1-web"
  publish = "apps/a1-web/dist"
  functions = "apps/a1-web/netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# SPA catch-all. Netlify serves functions at /.netlify/functions/* and static
# files before applying this rewrite, so it does not shadow them — no explicit
# function pass-through rule is needed (and one without a `to` is invalid).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
