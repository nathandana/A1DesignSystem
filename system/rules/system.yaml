component: System
rules:
  - id: system-heading-sentence-case
    components:
      - System
      - Heading
    enforcement:
      json:
        check: heading-sentence-case
        severity: warning
        locales: [en]
        components: [Heading, PageTitle, Card, OverviewCard, Banner, Dialog, VerificationDialog, EmptyState]
        fields: [title, heading, headline, emptyTitle]
        reason: Title-case detection is advisory because proper names and language-specific capitalization need human review.
    requirement: Use sentence case for headings.
    do: Write headings like "Create account", "Payment details", or "Recent activity".
    dont: Write headings in title case like "Create Account", "Payment Details", or "Recent Activity".
    applies_to:
      - content
      - typography
      - consistency
  - id: system-no-font-weight-on-state
    components:
      - System
    requirement: Never change font-weight on interactive or selection states.
    do: Use color, border, background, or underline to communicate hover, active, focus, and selected states.
    dont: Apply a different font-weight on :hover, :active, :focus, [aria-selected="true"], [aria-current], or [aria-pressed] — this causes the element to resize, which can shift surrounding layout and cause reflow.
    applies_to:
      - css
      - interaction
      - typography

  - id: system-no-uppercase-content
    components:
      - System
      - Heading
      - Paragraph
    requirement: Do not use uppercase transforms on content text.
    do: Write "Submit form" or "Recent activity" — sentence-case content reads clearly for all users.
    dont: Apply text-transform uppercase or write all-caps content, as screen readers may spell out individual characters.
    applies_to:
      - content
      - typography
      - accessibility
    enforcement:
      eslint: no-uppercase-text
      css: true
      json:
        check: authored-text-case
        severity: error
        transforms: [uppercase, lowercase, capitalize]
        textFields: [label, title, heading, headline, subtitle, description, text, message, caption, alt, placeholder, helperText, hint, errorMessage, successMessage, emptyMessage, legend, eyebrow, kicker, logo, logoText, menuLabel, actionLabel, actionsLabel, anchorLabel, backLabel, bubbleLabel, cancelLabel, clearLabel, confirmLabel, copiedLabel, copyLabel, createLabel, emptyText, emptyTitle, footerLabel, formatLabel, listViewLabel, moreText, overflowLabel, searchLabel, showToolbarLabel, sortLabel, statusLabel, sublabel, subtext, aria-label, aria-description, aria-valuetext, aria-braillelabel]
        collections: [items, options, actions, menuActions, details, columns, navItems, tabs, panels, tools, links, groups, children]
        excludedContentComponents: [Code, CustomBlock, Icon]
        displayValues:
          DefinitionList: [value]
          OverviewCard: [value]
          Stat: [value, prefix, suffix]
        exceptions:
          # Exact tokens only; never a page-level opt-out. Add approved terms here.
          tokens: [DTCG, WCAG, WAI, ARIA, RSC, SDK, PNG, JPG, JPEG, GIF, HEIC, AVIF, WEBP, SVG, MP4, MP3, A1, S, M, L, XS, XL, XXL, XXXL, XXS, USD, EUR, GBP, CAD, AUD, JPY, CNY, CHF, SCE, API, APIs, UI, UX, CSS, HTML, JSON, MCP, HTTP, HTTPS, URL, URLs, ID, IDs, UUID, XML, SQL, PDF, CSV, CPU, GPU, RAM, USB, SMS, FAQ, FAQs, AI, ML, AR, VR, USA, US, UK, EU, UTC, GMT, NASA, NHS, IBM, IKEA, BMW, NFL, NBA, NHL, MLB, NCAA, FIFA, FIA, F1, FOM, DRS, ERS, DNA, RGB, HSL, HEX]
          localeTokens:
            en: [UN, WHO, AM, PM]
          names: [A1 Design System, A1 Design, A1:Design, New England, New York, React, React Native, JavaScript, TypeScript, Supabase, Netlify, Figma, OpenAI, ChatGPT, GitHub, Storybook]

  - id: system-tokens-only
    components:
      - System
    requirement: Every visual value must come from a design token — never hardcode a raw colour, spacing, font, radius, shadow, or duration.
    do: Reference a CSS custom property that maps to a Style Dictionary token, e.g. color of var(--semantic-color-action-background). If no token fits, add one to system/tokens/ first.
    dont: Write a raw hex/rgb/hsl colour (or other raw value) in a style declaration, inline style, or component CSS. A raw fallback in var(--token, …) is allowed only for a token guaranteed to exist.
    applies_to:
      - css
      - color
      - consistency
    enforcement:
      eslint: no-raw-color
      css: true
