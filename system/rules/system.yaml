component: System
rules:
  - id: system-heading-sentence-case
    components:
      - System
      - Heading
    requirement: Use sentence case for headings.
    do: Write headings like "Create account", "Payment details", or "Recent activity".
    dont: Write headings in title case like "Create Account", "Payment Details", or "Recent Activity".
    applies_to:
      - content
      - typography
      - consistency
  - id: system-no-font-weight-on-state
    components:
      - System
    requirement: Never change font-weight on interactive or selection states.
    do: Use color, border, background, or underline to communicate hover, active, focus, and selected states.
    dont: Apply a different font-weight on :hover, :active, :focus, [aria-selected="true"], [aria-current], or [aria-pressed] — this causes the element to resize, which can shift surrounding layout and cause reflow.
    applies_to:
      - css
      - interaction
      - typography

  - id: system-no-uppercase-content
    components:
      - System
      - Heading
      - Paragraph
    requirement: Do not use uppercase transforms on content text.
    do: Write "Submit form" or "Recent activity" — sentence-case content reads clearly for all users.
    dont: Apply text-transform uppercase or write ALL CAPS content, as screen readers may spell out individual characters.
    applies_to:
      - content
      - typography
      - accessibility
