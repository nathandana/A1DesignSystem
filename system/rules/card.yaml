component: Card
rules:
  - id: card-navigation-no-nested-interactive
    components:
      - Card
    requirement: Do not place interactive elements inside a Card when the Card itself is the interactive element.
    do: Use `variant="navigation"` with a single `href` or navigation handler, and keep the card contents to static text, icons, images, lists, and layout components.
    dont: Put buttons, links, form controls, menus, tabs, or other clickable controls inside a navigation Card.
    applies_to:
      - accessibility
      - interaction
      - semantic-html
    enforcement:
      eslint: no-nested-interactive-in-card

  - id: card-navigation-single-destination
    components:
      - Card
    requirement: Use navigation Cards only when the entire card represents one destination.
    do: Make the Card destination match the title and supporting content.
    dont: Use a navigation Card when different parts of the card imply different actions or destinations.
    applies_to:
      - usability
      - content
      - interaction

  - id: card-not-for-page-sections
    components:
      - Card
      - Section
    requirement: Do not use Card to create page-level sections or large content blocks.
    do: Use `Section` for page-level regions — it provides the correct surface, padding, width constraints, and theme support. Reserve Card for small, repeated, bounded content units such as product tiles, user profiles, summary items, or navigation destinations.
    dont: Wrap a hero, a full-page form, a marketing row, an article body, or any other large block of content in a Card. A Card that spans a full content column or contains a long-form layout is a misuse of the component.
    applies_to:
      - layout
      - semantics
      - usability

  - id: cards-in-grid
    components:
      - Card
      - Grid
    requirement: A set of two or more sibling Cards (product tiles, feature cards, profiles) should be laid out in a Grid, not placed loosely in a Stack or Section.
    do: 'Wrap repeated Cards in `<Grid columns={{ xs: 1, md: 3 }} gap="md">` so they form even rows that reflow responsively.'
    dont: Drop several Cards directly into a Section or Stack where they stretch full-width or wrap unevenly.
    applies_to:
      - layout
      - consistency

  - id: card-image-aspect-ratio
    components:
      - Card
      - Figure
    requirement: An image inside a Card should declare a valid, consistent aspect ratio so a grid of cards has uniform image heights.
    do: Set `aspectRatio` on the card's `Figure` to a token value (`16:9`, `4:3`, `3:2`, `1:1`, `2:3`, `3:4`, `9:16`, `21:9`) and use the same ratio across all cards in the same grid.
    dont: Omit `aspectRatio` (images render at varying natural heights) or pass a CSS-style value like `"4 / 3"` — only the colon token values apply a ratio.
    applies_to:
      - layout
      - consistency
      - media

  - id: card-status-not-color-only
    components:
      - Card
    requirement: A Card's `status` must be conveyed by text, not by the colour stripe alone. Colour-only status fails WCAG 2.1 SC 1.4.1 Use of Color (Level A). If the status is shown only by colour, it is not WCAG compliant.
    do: Whenever you set `status`, also display the status as text — pass `statusLabel` so the stripe is paired with a text badge, or make sure the status is named in visible text the card carries or sits within (a status badge in the card content, or a labelled column/lane the card belongs to, e.g. a Kanban board grouped by status). Treat the stripe and the `statusPulse` animation as decorative reinforcement of that text.
    dont: Set `status` with no `statusLabel` and no other visible status text, so the colour stripe (or the pulse animation) is the only way to tell one status from another. Never rely on colour or motion alone to communicate status.
    applies_to:
      - accessibility
      - content
      - color
