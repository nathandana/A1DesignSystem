name: Supabase backup

# Daily pg_dump of the Supabase database(s) → uploaded as a private workflow artifact
# (and optionally to S3). Set the SUPABASE_DB_URL repo secret to the **Session pooler**
# connection string (Dashboard → Project Settings → Database → Connection string →
# "Session pooler"), with the DB password. See backups/README.md.

on:
  schedule:
    - cron: '17 7 * * *' # every day at 07:17 UTC
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_DIR: ${{ runner.temp }}/backups
      BACKUP_KEEP_DAYS: '0' # ephemeral runner — don't prune
      HAS_S3: ${{ secrets.BACKUP_S3_BUCKET != '' && secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump (PostgreSQL client 17)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_BACKUP_TARGETS: ${{ secrets.SUPABASE_BACKUP_TARGETS }}
        run: node scripts/backup-supabase.mjs

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_DIR }}/*.dump
          retention-days: 90
          if-no-files-found: error

      # Optional durable copy to S3 — runs only when the AWS_* + BACKUP_S3_BUCKET secrets are set.
      - name: Upload to S3
        if: env.HAS_S3 == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          aws s3 cp "$BACKUP_DIR/" "s3://$BUCKET/supabase/$(date -u +%Y/%m)/" \
            --recursive --exclude '*' --include '*.dump'
