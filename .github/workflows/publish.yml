name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Publish packages (skip if version already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for PKG in packages/react packages/react-native; do
            NAME=$(cd $PKG && npm pkg get name | tr -d '"')
            VERSION=$(cd $PKG && npm pkg get version | tr -d '"')
            PUBLISHED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
            if [ -z "$PUBLISHED" ]; then
              echo "→ Publishing ${NAME}@${VERSION}"
              (cd $PKG && npm publish)
            else
              echo "→ ${NAME}@${VERSION} already published — skipping"
            fi
          done
