name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  a1-web-baseline:
    name: A1-Web release baseline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run release checks
        run: npm run release:a1-web:check

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a1-web-baseline-${{ github.sha }}
          path: test-results/a1-web/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: a1-web-baseline

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Publish packages (skip if version already on npm)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for PKG in packages/react packages/react-native; do
            NAME=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PKG/package.json','utf8'));process.stdout.write(p.name)")
            VERSION=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('$PKG/package.json','utf8'));process.stdout.write(p.version)")
            PUBLISHED=$(npm view "${NAME}@${VERSION}" version 2>/dev/null || true)
            if [ -z "$PUBLISHED" ]; then
              echo "→ Publishing ${NAME}@${VERSION}"
              (cd $PKG && npm publish)
            else
              echo "→ ${NAME}@${VERSION} already published — skipping"
            fi
          done
