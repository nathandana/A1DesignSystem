name: Publish to npm

on:
  push:
    branches: [release, main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so concurrent runs cannot race the npm latest tag.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  a1-web-baseline:
    name: A1-Web release baseline
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run release checks
        run: npm run release:a1-web:check

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a1-web-baseline-${{ github.sha }}
          path: test-results/a1-web/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: a1-web-baseline
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Build and validate release packages
        run: |
          npm run build:tokens
          npm run patterns:check
          npm run build:mcp-index:check
          npm run test:patterns
          npm run test:rsc
          npm run pack:check
          node --test scripts/publish-npm.test.mjs

      - name: Publish and verify npm versions
        run: node scripts/publish-npm.mjs
