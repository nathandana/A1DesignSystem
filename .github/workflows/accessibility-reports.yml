name: Update Accessibility Reports

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  update:
    name: Regenerate component accessibility reports
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build tokens
        run: npm run build:tokens

      - name: Update component accessibility reports
        run: npm run a11y:reports

      - name: Open PR with updated reports
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: accessibility-reports/update-${{ github.run_id }}
          commit-message: "chore: update accessibility reports"
          title: "chore: update accessibility reports"
          body: |
            Automated component accessibility report update.

            **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review the generated contrast values before merging.
          labels: accessibility
